name: Recordatorios push
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}
concurrency: { group: recordatorios, cancel-in-progress: false }
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Lima
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: backend
      - run: node backend/recordatorios.mjs
